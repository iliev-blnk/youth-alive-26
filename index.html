<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFB701">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Youth Alive 26">
<meta name="format-detection" content="telephone=no">
<title>Youth Alive 26 — Summer Camp</title>
<meta name="description" content="Everything you need for Youth Alive 26 Summer Camp — rules, packing list, transportation, schedule and more. All in one place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<script src="access.js"></script>
<script>try{if(localStorage.getItem("ya-access"))document.documentElement.classList.add("ya-ok");}catch(e){}</script>
<style>
  :root{
    --cream:#FBF6EC; --card:#FFFFFF;
    --ink:#232135; --muted:#736f88;
    --indigo:#4530E0; --tint:#EDEAFB;
    --sun:#FFB701; --sun-lite:#FFC64A;
    --line:#EBE5D6; --soft:#F4EFE3;
    --ok:#4530E0; --no:#736f88;
    --radius:20px;
    --shadow:0 6px 22px rgba(38,36,80,.05), 0 1px 2px rgba(38,36,80,.04);
    --maxw:760px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink); background:var(--cream);
    min-height:100vh; -webkit-font-smoothing:antialiased;
    line-height:1.6; font-size:16px;
  }
  a{color:var(--indigo);font-weight:600;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- Access gate ---------- */
  .gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:auto;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(130% 120% at 50% -10%, var(--sun-lite) 0%, var(--sun) 72%)}
  html.ya-ok .gate{display:none}
  html:not(.ya-ok){overflow:hidden}
  .gate-card{width:100%;max-width:360px;background:#fff;border-radius:22px;text-align:center;
    box-shadow:0 24px 70px rgba(35,33,53,.22);padding:26px 24px}
  .gate-logo{width:min(72%,220px);height:auto;display:block;margin:0 auto 16px}
  .gate-title{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);
    font-size:21px;line-height:1.2;margin:0 0 6px}
  .gate-sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  #gate-form{display:flex;flex-direction:column;gap:10px}
  #gate-email{width:100%;font-size:16px;padding:13px 15px;border:1px solid var(--line);
    border-radius:12px;font-family:inherit;color:var(--ink);background:var(--soft);text-align:center}
  #gate-email:focus{outline:none;border-color:var(--indigo);background:#fff}
  #gate-btn{min-height:50px;border:0;border-radius:12px;background:var(--indigo);color:#fff;
    font-family:"Figtree",sans-serif;font-weight:700;font-size:16px;cursor:pointer}
  #gate-btn:active{transform:scale(.98)}
  .gate-err{color:#CE5B4E;font-size:13px;font-weight:600;margin:12px 0 0}
  .gate-err[hidden]{display:none}
  .gate-lang{display:inline-flex;gap:2px;background:var(--soft);border-radius:999px;padding:4px;margin-top:18px}
  .gate-lang button{border:0;background:transparent;color:var(--indigo);font-family:"Figtree",sans-serif;
    font-weight:700;font-size:13px;padding:6px 15px;border-radius:999px;cursor:pointer}
  .gate-lang button[aria-pressed="true"]{background:var(--indigo);color:#fff}

  /* App shell: full-bleed on phones, a centered card on larger screens */
  .shell{max-width:540px;margin:0 auto;position:relative}
  @media(min-width:600px){
    body{background:#EAE3D4}
    .shell{margin:26px auto 44px;background:var(--cream);border-radius:26px;
      box-shadow:0 24px 70px rgba(35,33,53,.16)}
    header.hero{border-radius:26px 26px 0 0}
    footer{border-radius:0 0 26px 26px}
    .dhead{position:static}
  }

  /* ---------- Mobile-first base ---------- */
  html,body{overflow-x:clip}
  *{-webkit-tap-highlight-color:transparent}
  button,a,.chip,summary{touch-action:manipulation}
  img,svg{max-width:100%}
  .ic{width:24px;height:24px;flex:0 0 auto;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chip:active,.linkbtn:active,.lang button:active,.ib-install:active,.ib-x:active{transform:scale(.97)}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }

  /* ---------- Hero ---------- */
  header.hero{position:relative;text-align:center;background:var(--sun);
    padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 24px calc(18px + env(safe-area-inset-left))}
  .art{display:block;width:min(82%,370px);height:auto;margin:0 auto}
  .meta{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .pill{background:rgba(255,255,255,.92);color:var(--indigo);border-radius:999px;padding:8px 14px;
    font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
  .pill .ic{width:16px;height:16px;stroke-width:2}

  /* ---------- Language toggle ---------- */
  .lang{margin:16px auto 0;display:inline-flex;background:rgba(255,255,255,.5);
    border-radius:999px;padding:4px;gap:2px}
  .lang button{font-family:"Figtree",sans-serif;font-weight:700;font-size:14px;
    border:0;background:transparent;color:var(--indigo);padding:7px 18px;border-radius:999px;
    cursor:pointer;transition:.15s}
  .lang button[aria-pressed="true"]{background:var(--indigo);color:#fff}

  /* ---------- Mountains dividing hero into the body ---------- */
  .hero-range{display:block;width:100%;height:clamp(38px,9vw,58px);margin-top:22px}
  .hero-range .back{fill:var(--indigo);opacity:.12}
  .hero-range .front{fill:var(--cream)}

  /* ---------- Home tiles (the category menu) ---------- */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 0 8px}
  .tile{position:relative;display:flex;flex-direction:column;gap:12px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
    transition:transform .15s,box-shadow .15s,border-color .15s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(38,36,80,.10);border-color:var(--tint)}
  .tile:active{transform:translateY(0)}
  .tile .tico{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--tint);
    color:var(--indigo);display:grid;place-items:center}
  .tile .tico .ic{width:26px;height:26px}
  .tile .tlabel{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;line-height:1.15}
  .tile .thint{color:var(--muted);font-size:12.5px;margin-top:-7px}
  .tile .tsoon{position:absolute;top:13px;right:13px;background:var(--tint);color:var(--indigo);
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-radius:999px;padding:2px 7px}

  /* ---------- Detail header (shown when viewing one category) ---------- */
  .dhead{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
    background:rgba(251,246,236,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);min-height:54px}
  .dhead .lang{margin:0}
  .backbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--indigo);
    font-family:"Figtree",sans-serif;font-weight:700;font-size:15px;cursor:pointer;padding:8px 10px;border-radius:10px}
  .backbtn:hover{background:var(--soft)}
  .backbtn .ic{width:20px;height:20px;stroke-width:2.2}
  .dwrap{padding:20px 16px 44px}
  .tomenu{display:inline-flex;align-items:center;gap:6px;margin:0;border:1px solid var(--line);
    background:var(--card);color:var(--indigo);font-family:"Figtree",sans-serif;font-weight:700;font-size:14px;
    border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none}
  .tomenu:hover{background:var(--soft)}
  .tomenu .ic{width:18px;height:18px;stroke-width:2.2}

  /* view transitions (forward = open category, back = to menu) */
  .anim-fwd{animation:enterFwd .3s cubic-bezier(.22,.61,.36,1) both}
  .anim-back{animation:enterBack .3s cubic-bezier(.22,.61,.36,1) both}
  @keyframes enterFwd{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  @keyframes enterBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
  /* soft fade when swapping language in place */
  .flip{animation:flip .22s ease}
  @keyframes flip{from{opacity:.35}to{opacity:1}}

  /* ---------- Cards / sections ---------- */
  main{padding:22px 0 44px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px;margin:0 0 16px;scroll-margin-top:62px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .sec-ico{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--tint);
    color:var(--indigo);display:grid;place-items:center}
  .sec-ico .ic{width:22px;height:22px}
  .sec-title{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);
    font-size:clamp(20px,4.5vw,24px);margin:0;line-height:1.15;letter-spacing:-.2px}
  .intro{color:var(--muted);margin:-4px 0 16px;font-size:15px}

  /* quick facts */
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  .fact{padding:12px 0;border-bottom:1px solid var(--line)}
  .fact .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
  .fact .v{font-weight:600;color:var(--ink);font-size:15.5px;margin-top:3px}
  @media(max-width:520px){.facts{grid-template-columns:1fr}}

  /* rules */
  ol.rules{list-style:none;margin:0;padding:0;counter-reset:r}
  ol.rules li{counter-increment:r;display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
  ol.rules li:first-child{padding-top:0}
  ol.rules li:last-child{border-bottom:0;padding-bottom:0}
  ol.rules li::before{content:counter(r);flex:0 0 auto;width:27px;height:27px;border-radius:9px;
    background:var(--tint);color:var(--indigo);font-family:"Figtree",sans-serif;font-weight:700;
    display:grid;place-items:center;font-size:13px;margin-top:1px}
  .rule-t{font-weight:700;color:var(--ink)}
  .rule-d{color:var(--muted)}

  /* accordion */
  details.acc{border:1px solid var(--line);border-radius:14px;margin:0 0 8px;overflow:hidden;background:#fff}
  details.acc[open]{background:#fffdf8}
  details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:"Figtree",sans-serif;
    font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .caret{transition:.2s;font-size:12px;color:var(--muted)}
  details.acc[open]>summary{color:var(--indigo)}
  details.acc[open]>summary .caret{transform:rotate(180deg);color:var(--indigo)}
  details.acc .body{padding:2px 16px 16px}
  ul.check{list-style:none;padding:0;margin:0}
  ul.check li{position:relative;padding-left:26px;margin:9px 0;color:var(--ink)}
  ul.check li::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:10px;
    border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
  ul.no{list-style:none;padding:0;margin:0}
  ul.no li{position:relative;padding-left:26px;margin:10px 0;color:var(--ink)}
  ul.no li::before{content:"";position:absolute;left:4px;top:11px;width:11px;height:2px;
    background:var(--no);border-radius:2px}

  /* callout / placeholder */
  .callout{background:var(--soft);border:1px dashed rgba(255,183,1,.75);
    border-radius:14px;padding:16px;color:var(--muted);font-size:15px}
  .soon{display:inline-block;background:var(--tint);color:var(--indigo);font-weight:700;font-size:11px;
    vertical-align:middle;text-transform:uppercase;letter-spacing:.6px;border-radius:999px;padding:3px 9px;margin-left:8px}
  .tip{background:var(--soft);border-radius:12px;padding:12px 14px;margin:16px 0 0;font-size:14.5px;color:var(--muted)}
  .tip b{color:var(--ink);font-weight:700}
  .tip+.tip{margin-top:8px}

  /* music playlists */
  .pl{margin:0 0 16px}
  .pl:last-child{margin-bottom:0}
  .pl-cap{font-weight:700;color:var(--indigo);font-size:12.5px;text-transform:uppercase;
    letter-spacing:.5px;margin:0 0 8px}
  .spotify{width:100%;border:0;border-radius:14px;display:block}
  .video{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
  .video.portrait{aspect-ratio:9/16;max-width:300px;margin:0 auto}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .vfacade,.vlink{cursor:pointer;background:var(--indigo);text-decoration:none}
  .vthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vplay{position:absolute;inset:0;display:grid;place-items:center}
  .vplay svg{transition:transform .15s}
  .vfacade:hover .vplay svg,.vlink:hover .vplay svg{transform:scale(1.07)}
  .vwatch{position:absolute;left:10px;bottom:10px;background:rgba(20,18,40,.72);color:#fff;
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}

  /* transport */
  .subh{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);font-size:16px;margin:20px 0 8px}
  .facts.one{grid-template-columns:1fr}
  ol.steplist{margin:2px 0 0;padding-left:20px}
  ol.steplist li{margin:6px 0;color:var(--ink)}

  /* contact */
  .links{display:grid;gap:8px}
  .linkbtn{display:flex;align-items:center;gap:12px;text-decoration:none;
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);
    font-weight:600;transition:.15s}
  .linkbtn:hover{background:var(--soft)}
  .linkbtn .lico{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--tint);
    color:var(--indigo);display:grid;place-items:center}
  .linkbtn .lico .ic{width:20px;height:20px}
  .lmain{min-width:0}
  .lsub{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:1px}

  /* ---------- Install (Add to Home Screen) banner ---------- */
  .install-banner{position:fixed;left:8px;right:8px;bottom:8px;z-index:60;max-width:460px;margin:0 auto;
    background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 44px rgba(38,36,80,.22);
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(160%);opacity:0;transition:transform .34s cubic-bezier(.2,.75,.2,1),opacity .3s}
  .install-banner.visible{transform:translateY(0);opacity:1}
  .ib-row{display:flex;align-items:center;gap:12px}
  .ib-ico{width:46px;height:46px;flex:0 0 auto;border-radius:12px}
  .ib-txt{flex:1;min-width:0}
  .ib-txt strong{display:block;color:var(--ink);font-family:"Fraunces",serif;font-weight:600;font-size:16px;line-height:1.2}
  .ib-txt span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
  .ib-x{flex:0 0 auto;width:34px;height:34px;border:0;background:var(--soft);border-radius:50%;
    font-size:20px;color:var(--muted);cursor:pointer;line-height:1;display:grid;place-items:center}
  .ib-install{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:13px;
    background:var(--indigo);color:#fff;font-family:"Figtree",sans-serif;font-weight:700;font-size:15.5px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .ib-ios{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px 14px;
    color:var(--ink);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
  .ib-ios[hidden]{display:none}
  .ib-ios .shareico{flex:0 0 auto;margin-top:1px}
  .ib-ios b{color:var(--indigo)}

  footer{text-align:center;color:var(--muted);font-weight:600;font-size:14px;
    padding:8px 16px calc(34px + env(safe-area-inset-bottom))}
  footer .heart{color:var(--indigo)}
</style>
</head>
<body>

<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-card">
    <img class="gate-logo" id="gate-logo" src="artwork-en.png" alt="Youth Alive Summer Camp">
    <h1 class="gate-title" id="gate-title">Enter your email to continue</h1>
    <p class="gate-sub" id="gate-sub">Use the email you registered for camp with.</p>
    <form id="gate-form" novalidate>
      <input id="gate-email" type="email" inputmode="email" autocomplete="email"
        autocapitalize="off" spellcheck="false" required placeholder="you@example.com">
      <button type="submit" id="gate-btn">Enter</button>
    </form>
    <p class="gate-err" id="gate-err" hidden></p>
    <div class="gate-lang">
      <button type="button" data-lang="en" onclick="setLang('en')" aria-pressed="true">EN</button>
      <button type="button" data-lang="tr" onclick="setLang('tr')" aria-pressed="false">TR</button>
    </div>
  </div>
</div>

<div class="shell">
<div id="home">
<header class="hero">
  <h1 style="margin:0"><img class="art" id="hero-art" src="artwork-en.png" width="760" height="760" alt="Youth Alive Summer Camp — Bound by Love"></h1>
  <div class="meta">
    <span class="pill">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
      <span data-i18n="heroDates">18–20 September 2026</span>
    </span>
    <span class="pill">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s6-5.3 6-10a6 6 0 0 0-12 0c0 4.7 6 10 6 10Z"/><circle cx="12" cy="11" r="2.3"/></svg>
      <span data-i18n="heroLoc">Sapanca, Sakarya</span>
    </span>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" onclick="setLang('en')" aria-pressed="true">EN</button>
    <button data-lang="tr" onclick="setLang('tr')" aria-pressed="false">TR</button>
  </div>
  </header>
  <main class="wrap"><div class="tiles" id="tiles"></div></main>
</div>

<div id="detail" hidden>
  <div class="dhead">
    <button class="backbtn" type="button" onclick="goHome()">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      <span data-i18n="back">Menu</span>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" onclick="setLang('en')" aria-pressed="true">EN</button>
      <button data-lang="tr" onclick="setLang('tr')" aria-pressed="false">TR</button>
    </div>
  </div>
  <div class="wrap dwrap"><div id="view"></div></div>
</div>

<footer>
  <span data-i18n="footer">Youth Alive 26 · See you at camp</span> <span class="heart">♥</span>
</footer>
</div><!-- /.shell -->

<script>
/* ============================================================
   Youth Alive 26 — camp info hub. All content lives here.
   To update: edit the DATA object below. Every field has
   { en, tr }. Schedule + Music are placeholders — drop the
   real content into DATA.schedule / DATA.music when ready.
   ============================================================ */

const UI = {
  soon:      { en:"Coming soon", tr:"Yakında" },
  toMenu:    { en:"Back to menu", tr:"Menüye dön" },
  seeGroup:  { en:"More details will be shared in the WhatsApp participant group.",
               tr:"Daha fazla ayrıntı WhatsApp katılımcı grubunda paylaşılacaktır." },
  install: {
    title:   { en:"Add to Home Screen", tr:"Ana Ekrana Ekle" },
    body:    { en:"Install Youth Alive 26 for one-tap, offline access at camp.",
               tr:"Kampta tek dokunuşla, çevrimdışı erişim için Youth Alive 26'yı yükleyin." },
    btn:     { en:"Install app", tr:"Uygulamayı yükle" },
    iosBtn:  { en:"How to add it", tr:"Nasıl eklenir" },
    iosHint: { en:'Tap the <b>Share</b> button below, then choose <b>"Add to Home Screen"</b>.',
               tr:'Aşağıdaki <b>Paylaş</b> düğmesine dokunun, ardından <b>"Ana Ekrana Ekle"</b>yi seçin.' },
    dismiss: { en:"Dismiss", tr:"Kapat" },
  },
};

      { ico:"form", href:"https://forms.gle/eztjisRnFT7jb3Uh7", t:{en:"Pre-registration form",tr:"Ön kayıt formu"}, s:{en:"forms.gle · register early, spots are limited",tr:"forms.gle · erken kaydolun, yer sınırlı"} },
      { ico:"instagram", href:"https://www.instagram.com/youth.alivetr/", t:{en:"@youth.alivetr",tr:"@youth.alivetr"}, s:{en:"Youth Alive on Instagram",tr:"Instagram'da Youth Alive"} },
      { ico:"tent", href:"https://www.instagram.com/vadicamping/", t:{en:"@vadicamping",tr:"@vadicamping"}, s:{en:"The campground",tr:"Kamp alanı"} },
    ],
    note:{ en:"Questions? Ask in the WhatsApp participant group — Esau and the team are there to help.",
           tr:"Sorularınız mı var? WhatsApp katılımcı grubunda sorun — Esau ve ekip yardıma hazır." },
  },
};

/* ---------- rendering ---------- */
// Language priority: ?lang= URL override → saved choice → browser language → English.
const urlLang = new URLSearchParams(location.search).get("lang");
let lang = ["en","tr"].includes(urlLang) ? urlLang : localStorage.getItem("ya-lang");
if (!["en","tr"].includes(lang)){
  lang = (navigator.language||"").toLowerCase().startsWith("tr") ? "tr" : "en";
}
if (urlLang) localStorage.setItem("ya-lang", lang);

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o => esc(o[lang]);

function sectionShell(id, title, inner, noteHtml){
  return `<section class="card" id="${id}">
    <div class="sec-head"><div class="sec-ico">${ICONS[id]||""}</div><h2 class="sec-title">${title}</h2></div>
    ${inner}
    ${noteHtml||""}
  </section>`;
}

function renderFacts(d){
  const facts = d.items.map(i=>`<div class="fact"><div class="k">${L(i.k)}</div><div class="v">${L(i.v)}</div></div>`).join("");
  return sectionShell("facts", L(d.title),
    `<div class="facts">${facts}</div>`,
    `<div class="tip">${L(d.note)}</div>`);
}

function renderPlaceholder(id, d){
  return sectionShell(id, `${L(d.title)}<span class="soon">${L(UI.soon)}</span>`,
    `<div class="callout">${L(d.text)}</div>`);
}

function renderRules(d){
  const lis = d.list.map(r=>`<li><div><span class="rule-t">${L(r.t)}.</span> <span class="rule-d">${L(r.d)}</span></div></li>`).join("");
  return sectionShell("rules", L(d.title),
    `<p class="intro">${L(d.intro)}</p><ol class="rules">${lis}</ol>`);
}

function renderPacking(d){
  const groups = d.groups.map((g,idx)=>{
    const items = g.items.map(i=>`<li>${L(i)}</li>`).join("");
    return `<details class="acc" ${idx===0?"open":""}>
      <summary>${L(g.name)} <span class="caret">▾</span></summary>
      <div class="body"><ul class="check">${items}</ul></div>
    </details>`;
  }).join("");
  return sectionShell("packing", L(d.title),
    `<p class="intro">${L(d.intro)}</p>${groups}<div class="tip">${L(d.tip)}</div>`);
}

function renderDont(d){
  const items = d.items.map(i=>`<li>${L(i)}</li>`).join("");
  return sectionShell("dont", L(d.title), `<ul class="no">${items}</ul>`);
}

function renderTransport(d){
  const routes = d.routes.map((r,i)=>{
    const steps = r.steps.map(s=>`<li>${L(s)}</li>`).join("");
    return `<details class="acc" ${i===0?"open":""}>
      <summary>${L(r.name)} <span class="caret">▾</span></summary>
      <div class="body"><ol class="steplist">${steps}</ol></div>
    </details>`;
  }).join("");
  const fares = d.fares.map(f=>`<div class="fact"><div class="k">${L(f.k)}</div><div class="v">${L(f.v)}</div></div>`).join("");
  const arrLabel = lang==="en" ? "On arrival in Sapanca" : "Sapanca'ya varışta";
  const retLabel = lang==="en" ? "Return" : "Dönüş";
  return sectionShell("transport", L(d.title),
    `<p class="intro">${L(d.intro)}</p>
     <div class="subh">${L(d.routesTitle)}</div>
     ${routes}
     <div class="subh">${L(d.faresTitle)}</div>
     <div class="facts one">${fares}</div>
     <div class="tip"><b>${arrLabel}</b><br>${d.arrival[lang]}</div>
     <div class="tip"><b>${retLabel}</b><br>${d.ret[lang]}</div>`);
}

function renderMusic(d){
  const lists = d.playlists.map(p=>`
    <div class="pl">
      <div class="pl-cap">${L(p)}</div>
      <iframe class="spotify" title="${L(p)}" loading="lazy" height="352"
        src="https://open.spotify.com/embed/playlist/${encodeURIComponent(p.id)}?utm_source=generator"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>`).join("");
  return sectionShell("music", L(d.title),
    `<p class="intro">${L(d.intro)}</p>${lists}`);
}

function renderVideos(d){
  const play = '<span class="vplay"><svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(20,18,40,.6)"/><path d="M10 8.2l6 3.8-6 3.8z" fill="#fff"/></svg></span>';
  const vids = d.videos.map(v=>{
    let media;
    if (v.file){
      // Self-hosted video: native player, plays inline everywhere (no platform limits)
      media = `<video class="video${v.portrait ? " portrait" : ""}" controls playsinline preload="metadata"${v.poster ? ` poster="${v.poster}"` : ""}>
        <source src="${v.file}" type="video/mp4"></video>`;
    } else if (v.yt && v.watch){
      // Embedding disabled by the owner -> clean poster that opens the video on YouTube
      const yt = encodeURIComponent(v.yt);
      media = `<a class="video vlink" href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener" aria-label="${L(v)}">
        <img class="vthumb" src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
        ${play}<span class="vwatch">${lang==="en" ? "Watch on YouTube" : "YouTube'da izle"}</span></a>`;
    } else if (v.yt){
      // YouTube plays reliably inline (Drive's inline player is janky on mobile)
      media = `<div class="video${v.portrait ? " portrait" : ""}"><iframe title="${L(v)}" loading="lazy" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.yt)}?rel=0"></iframe></div>`;
    } else {
      // Drive: poster that loads the player INLINE on tap (no jumping out to Drive)
      const id = encodeURIComponent(v.id);
      media = `<div class="video vfacade" role="button" tabindex="0" aria-label="${L(v)}"
        data-src="https://drive.google.com/file/d/${id}/preview">
        <img class="vthumb" src="https://drive.google.com/thumbnail?id=${id}&sz=w1000" alt="" loading="lazy" onerror="this.remove()">
        ${play}</div>`;
    }
    return `<div class="pl"><div class="pl-cap">${L(v)}</div>${media}</div>`;
  }).join("");
  return sectionShell("videos", L(d.title), `<p class="intro">${L(d.intro)}</p>${vids}`);
}

function renderNotes(d){
  const items = d.items.map(i=>`<div class="tip"><b>${L(i.t)}</b><br>${L(i.d)}</div>`).join("");
  return sectionShell("notes", L(d.title), items);
}

function renderContact(d){
  const links = d.links.map(l=>`<a class="linkbtn" href="${esc(l.href)}" target="_blank" rel="noopener">
      <span class="lico">${ICONS[l.ico]||""}</span><span class="lmain">${L(l.t)}<span class="lsub">${L(l.s)}</span></span></a>`).join("");
  return sectionShell("contact", L(d.title),
    `<div class="links">${links}</div>`,
    `<div class="tip">${L(d.note)}</div>`);
}

/* one renderer per section, keyed by id (matches nav + hash) */
const SECTION_RENDERERS = {
  facts:     ()=>renderFacts(DATA.facts),
  schedule:  ()=>renderPlaceholder("schedule", DATA.schedule),
  rules:     ()=>renderRules(DATA.rules),
  packing:   ()=>renderPacking(DATA.packing),
  dont:      ()=>renderDont(DATA.dont),
  transport: ()=>renderTransport(DATA.transport),
  music:     ()=>renderMusic(DATA.music),
  videos:    ()=>renderVideos(DATA.videos),
  notes:     ()=>renderNotes(DATA.notes),
  contact:   ()=>renderContact(DATA.contact),
};

function renderTiles(){
  document.getElementById("tiles").innerHTML = DATA.nav.map(n=>`
    <a class="tile" href="#${n.id}">
      ${n.soon ? `<span class="tsoon">${L(UI.soon)}</span>` : ""}
      <span class="tico">${ICONS[n.id]||""}</span>
      <span class="tlabel">${esc(n[lang])}</span>
      <span class="thint">${esc(lang==="en" ? n.he : n.ht)}</span>
    </a>`).join("");
}

/* ---------- Access gate (client-side soft gate; emails stored as hashes) ---------- */
const GATE = {
  title:{en:"Enter your email to continue", tr:"Devam etmek için e-postanızı girin"},
  sub:{en:"Use the email you registered for camp with.", tr:"Kampa kaydolduğunuz e-posta ile girin."},
  ph:{en:"you@example.com", tr:"siz@ornek.com"},
  btn:{en:"Enter", tr:"Giriş yap"},
  err:{en:"That email isn't on the list. Please check with the Youth Alive team.",
       tr:"Bu e-posta listede yok. Lütfen Youth Alive ekibiyle iletişime geçin."},
};
const gEl = id => document.getElementById(id);
const normEmail = s => String(s||"").trim().toLowerCase();
const gateList = () => Array.isArray(window.YA_ALLOW) ? window.YA_ALLOW.map(h=>String(h).toLowerCase()) : [];
async function sha256hex(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function paintGate(){
  if (!gEl("gate-title")) return;
  gEl("gate-title").textContent = GATE.title[lang];
  gEl("gate-sub").textContent   = GATE.sub[lang];
  gEl("gate-btn").textContent   = GATE.btn[lang];
  gEl("gate-email").placeholder = GATE.ph[lang];
  gEl("gate-logo").src = lang==="en" ? "artwork-en.png" : "artwork-tr.png";
}
function openApp(){ document.documentElement.classList.add("ya-ok"); }
function initGate(){
  const list = gateList();
  const saved = (localStorage.getItem("ya-access")||"").toLowerCase();
  if (list.length===0 || (saved && list.includes(saved))){ openApp(); return; } // allowed / gate off
  if (saved && !list.includes(saved)) localStorage.removeItem("ya-access");      // removed from list
  document.documentElement.classList.remove("ya-ok");
  paintGate();
  setTimeout(()=>{ const i=gEl("gate-email"); if (i) i.focus(); }, 60);
  gEl("gate-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const err = gEl("gate-err");
    const hash = await sha256hex(normEmail(gEl("gate-email").value));
    const l = gateList();
    if (l.length===0 || l.includes(hash)){
      localStorage.setItem("ya-access", hash);
      err.hidden = true;
      openApp();
    } else {
      err.textContent = GATE.err[lang];
      err.hidden = false;
    }
  });
}

/* static i18n bits + toggle state + tiles. Does not switch views. */
function render(){
  document.documentElement.lang = lang;
  const txt = {
    eyebrow:{en:"Summer Camp",tr:"Yaz Kampı"},
    tagline:{en:"Bound by Love",tr:"Sevgiyle Birleşen"},
    heroDates:{en:"18–20 September 2026",tr:"18–20 Eylül 2026"},
    heroLoc:{en:"Sapanca, Sakarya",tr:"Sapanca, Sakarya"},
    footer:{en:"Youth Alive 26 · See you at camp",tr:"Youth Alive 26 · Kampta görüşürüz"},
    back:{en:"Menu",tr:"Menü"},
  };
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (txt[k]) el.textContent = txt[k][lang];
  });
  document.querySelectorAll("[data-lang]").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.lang===lang));
  const art = document.getElementById("hero-art");
  if (art){
    art.src = lang==="en" ? "artwork-en.png" : "artwork-tr.png";
    art.alt = lang==="en" ? "Youth Alive Summer Camp — Bound by Love"
                          : "Youth Alive Yaz Kampı — Sevgiyle Birleşen";
  }
  renderTiles();
  paintGate();
}

/* ---------- view routing: home (tiles) <-> one category ---------- */
function playAnim(el, cls){
  if (!el) return;
  el.classList.remove("anim-fwd","anim-back","flip");
  void el.offsetWidth;                 // force reflow so the animation restarts
  el.classList.add(cls);
}

function showHome(preserveScroll, animate){
  document.getElementById("detail").hidden = true;
  document.getElementById("home").hidden = false;
  localStorage.setItem("ya-view", "");
  if (!preserveScroll) window.scrollTo(0,0);
  if (animate) playAnim(document.getElementById("tiles"), "anim-back");
}

function showSection(id, preserveScroll, animate){
  const body = SECTION_RENDERERS[id] ? SECTION_RENDERERS[id]() : "";
  const view = document.getElementById("view");
  view.innerHTML =
    `${body}
     <button class="tomenu" type="button" onclick="goHome()">
       <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 5-7 7 7 7"/></svg>
       ${esc(UI.toMenu[lang])}
     </button>`;
  document.getElementById("home").hidden = true;
  document.getElementById("detail").hidden = false;
  localStorage.setItem("ya-view", id);   // remember where we are
  if (!preserveScroll) window.scrollTo(0,0);
  if (animate) playAnim(view, "anim-fwd");
}

function route(preserveScroll, animate){
  const id = decodeURIComponent(location.hash.replace(/^#/,""));
  if (SECTION_RENDERERS[id]) showSection(id, preserveScroll, animate);
  else showHome(preserveScroll, animate);
}

function goHome(){
  if (location.hash) location.hash = "";   // fires hashchange -> route()
  else showHome();
}

let refreshInstall = ()=>{};   // reassigned by the install banner once it exists

function setLang(l){
  lang = l;
  localStorage.setItem("ya-lang", l);
  // keep the reading position and any open accordions across the language swap
  const y = window.scrollY;
  const openIdx = [...document.querySelectorAll("#view details.acc")]
    .map((d,i)=> d.open ? i : -1).filter(i=> i>=0);
  render();
  route(true);
  const accs = document.querySelectorAll("#view details.acc");
  openIdx.forEach(i=>{ if (accs[i]) accs[i].open = true; });
  window.scrollTo(0, y);
  const onDetail = !document.getElementById("detail").hidden;
  playAnim(onDetail ? document.getElementById("view") : document.getElementById("tiles"), "flip");
  refreshInstall();
}

window.addEventListener("hashchange", ()=>route(false, true));

// Click a Drive video poster -> load the player inline (don't leave the page).
function playFacade(f){
  const src = f.getAttribute("data-src");
  if (!src) return;
  f.innerHTML = `<iframe title="video" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen src="${src}"></iframe>`;
  f.classList.remove("vfacade");
}
document.addEventListener("click", e=>{
  const f = e.target.closest && e.target.closest(".vfacade");
  if (f) playFacade(f);
});
document.addEventListener("keydown", e=>{
  if ((e.key==="Enter" || e.key===" ") && e.target.classList && e.target.classList.contains("vfacade")){
    e.preventDefault(); playFacade(e.target);
  }
});

// Restore the last-viewed category (persists across reloads / closing the tab).
if (!location.hash){
  const saved = localStorage.getItem("ya-view");
  if (saved && SECTION_RENDERERS[saved]) history.replaceState(null, "", "#"+saved);
}
render();
route();
initGate();

/* service worker for offline use */
if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ---------- Add-to-Home-Screen banner (Android + iOS) ---------- */
(function initInstall(){
  const params      = new URLSearchParams(location.search);
  const forcePreview= params.get("install") === "1";           // ?install=1 to preview anywhere
  const isStandalone= matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (isStandalone) return;                                     // already installed
  if (!forcePreview && localStorage.getItem("ya-install-dismissed")) return; // don't nag

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const shareIcon = '<svg class="shareico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4530E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M6 12H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2h-1"/></svg>';
  let deferred = null;   // Android beforeinstallprompt event
  let banner   = null;

  const T = k => UI.install[k][lang];
  const nativeMode = () => !!deferred;   // Android prompt available

  function paint(){
    if (!banner) return;
    banner.innerHTML =
      `<div class="ib-row">
         <img class="ib-ico" src="icon-192.png" alt="">
         <div class="ib-txt"><strong>${esc(T("title"))}</strong><span>${esc(T("body"))}</span></div>
         <button class="ib-x" type="button" aria-label="${esc(T("dismiss"))}">&times;</button>
       </div>
       <button class="ib-install" type="button">${esc(nativeMode() ? T("btn") : T("iosBtn"))}</button>
       <div class="ib-ios" hidden>${shareIcon}<div>${T("iosHint")}</div></div>`;
    banner.querySelector(".ib-x").onclick = dismiss;
    banner.querySelector(".ib-install").onclick = onInstall;
  }

  function build(){
    if (banner) return;
    banner = document.createElement("div");
    banner.className = "install-banner";
    banner.setAttribute("role","dialog");
    banner.setAttribute("aria-label","Install app");
    document.body.appendChild(banner);
    paint();
    refreshInstall = ()=>{ if (banner) paint(); };   // keep text in sync with EN/TR toggle
  }

  function show(){
    build();
    if (forcePreview && !nativeMode()) banner.querySelector(".ib-ios").hidden = false; // full preview
    requestAnimationFrame(()=>{
      banner.classList.add("visible");
      // make sure the banner never hides the last section
      document.body.style.paddingBottom = (banner.offsetHeight + 20) + "px";
    });
  }

  function hide(){
    if (!banner) return;
    banner.classList.remove("visible");
    document.body.style.paddingBottom = "";
  }

  function dismiss(){
    hide();
    if (!forcePreview) localStorage.setItem("ya-install-dismissed", "1");
  }

  async function onInstall(){
    if (nativeMode()){
      deferred.prompt();
      try { await deferred.userChoice; } catch(e){}
      deferred = null;
      hide();
    } else {
      // iOS / preview: reveal the manual instructions
      const hint = banner.querySelector(".ib-ios");
      hint.hidden = !hint.hidden;
      document.body.style.paddingBottom = (banner.offsetHeight + 20) + "px";
    }
  }

  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault();
    deferred = e;
    paint();          // switch button label to native "Install app"
    show();
  });
  window.addEventListener("appinstalled", ()=>{
    deferred = null;
    localStorage.setItem("ya-install-dismissed", "1");
    hide();
  });

  // iOS never fires beforeinstallprompt → offer manual instructions after a short beat.
  if (isIOS || forcePreview){
    setTimeout(show, forcePreview ? 300 : 1500);
  }
})();
</script>
