<style>
  :root{
    --bg-top:#FFD23F; --bg-bot:#F7941D;
    --indigo:#2C2A8E; --purple:#4B3FA0; --cyan:#21C3E0;
    --card:#FFFFFF; --ink:#20204A; --muted:#5b5b86;
    --line:#e7e7f3; --soft:#f4f4fb;
    --radius:22px; --shadow:0 18px 40px rgba(44,42,142,.18);
    --maxw:820px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 60%,#e97e12 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  a{color:var(--indigo);font-weight:700}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- Decorative silhouettes ---------- */
  .silhouette{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:0;pointer-events:none;opacity:.9;line-height:0}
  .silhouette svg{width:100%;height:auto;display:block}
  .content{position:relative;z-index:1}

  /* ---------- Hero ---------- */
  header.hero{position:relative;text-align:center;padding:34px 16px 20px;overflow:hidden}
  .flame{font-size:0;line-height:0}
  .flame svg{width:52px;height:52px;filter:drop-shadow(0 4px 0 rgba(44,42,142,.25))}
  .brand{
    font-family:"Anton",sans-serif;letter-spacing:2px;line-height:.92;
    color:var(--indigo);text-transform:uppercase;
    font-size:clamp(38px,10vw,72px);margin:6px 0 0;
    text-shadow:3px 3px 0 rgba(255,255,255,.7);
  }
  .brand .yr{color:var(--cyan);-webkit-text-stroke:2px var(--indigo);paint-order:stroke fill}
  .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
  .sub .summer{font-family:"Pacifico",cursive;font-size:clamp(26px,7vw,44px);color:#0f9fc4;
    text-shadow:2px 2px 0 #fff;transform:rotate(-4deg)}
  .sub .camp{font-family:"Anton",sans-serif;font-size:clamp(28px,7.5vw,48px);letter-spacing:2px;
    color:var(--indigo);text-transform:uppercase}
  .tagline{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--indigo);
    text-transform:uppercase;letter-spacing:3px;font-size:13px;margin-top:6px;opacity:.85}
  .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .pill{background:var(--indigo);color:#fff;border-radius:999px;padding:7px 15px;
    font-weight:800;font-size:14px;display:inline-flex;gap:7px;align-items:center;
    box-shadow:0 6px 0 rgba(44,42,142,.25)}
  .pill.alt{background:#fff;color:var(--indigo)}

  /* ---------- Language toggle ---------- */
  .lang{margin:18px auto 0;display:inline-flex;background:rgba(255,255,255,.55);
    border:2px solid var(--indigo);border-radius:999px;padding:4px}
  .lang button{font-family:"Fredoka",sans-serif;font-weight:700;font-size:15px;
    border:0;background:transparent;color:var(--indigo);padding:7px 20px;border-radius:999px;
    cursor:pointer;transition:.15s}
  .lang button[aria-pressed="true"]{background:var(--indigo);color:#fff}

  /* ---------- Sticky nav ---------- */
  nav.chips{position:sticky;top:0;z-index:20;background:rgba(255,210,63,.92);
    backdrop-filter:blur(8px);border-bottom:2px solid rgba(44,42,142,.15);
    margin-top:16px}
  .chips-inner{display:flex;gap:8px;overflow-x:auto;padding:11px 16px;
    max-width:var(--maxw);margin:0 auto;scrollbar-width:none}
  .chips-inner::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex:0 0 auto;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:14px;background:#fff;color:var(--indigo);border:2px solid var(--indigo);
    border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:.15s}
  .chip:hover{background:var(--indigo);color:#fff}
  .chip.active{background:var(--indigo);color:#fff}

  /* ---------- Cards / sections ---------- */
  main{padding:22px 0 60px}
  section.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px;margin:0 0 20px;scroll-margin-top:70px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 6px}
  .sec-ico{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--soft);
    display:grid;place-items:center;font-size:22px}
  .sec-title{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--indigo);
    font-size:clamp(21px,5vw,26px);margin:0;line-height:1.1}
  .sec-note{color:var(--muted);font-size:14px;margin:0}
  .intro{color:var(--muted);margin:4px 0 14px;font-size:15px}

  /* quick facts */
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fact{background:var(--soft);border-radius:14px;padding:12px 14px}
  .fact .k{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);font-weight:800}
  .fact .v{font-weight:800;color:var(--ink);font-size:15px;margin-top:2px}
  @media(max-width:480px){.facts{grid-template-columns:1fr}}

  /* rules */
  ol.rules{list-style:none;margin:0;padding:0;counter-reset:r}
  ol.rules li{counter-increment:r;display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  ol.rules li:last-child{border-bottom:0}
  ol.rules li::before{content:counter(r);flex:0 0 auto;width:28px;height:28px;border-radius:50%;
    background:var(--indigo);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;
    display:grid;place-items:center;font-size:14px;margin-top:1px}
  .rule-t{font-weight:800;color:var(--indigo)}
  .rule-d{color:var(--ink)}

  /* accordion */
  details.acc{border:2px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden;background:#fff}
  details.acc[open]{border-color:var(--indigo)}
  details.acc>summary{list-style:none;cursor:pointer;padding:13px 15px;font-family:"Fredoka",sans-serif;
    font-weight:600;color:var(--indigo);display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .caret{transition:.2s;font-size:13px;color:var(--purple)}
  details.acc[open]>summary .caret{transform:rotate(180deg)}
  details.acc .body{padding:0 15px 14px}
  ul.list{margin:6px 0 0;padding-left:20px}
  ul.list li{margin:5px 0}
  ul.check{list-style:none;padding:0;margin:6px 0 0}
  ul.check li{position:relative;padding-left:26px;margin:7px 0}
  ul.check li::before{content:"✓";position:absolute;left:0;top:0;color:#149a6b;font-weight:900}
  ul.no{list-style:none;padding:0;margin:6px 0 0}
  ul.no li{position:relative;padding-left:26px;margin:7px 0}
  ul.no li::before{content:"✕";position:absolute;left:0;top:0;color:#d23b3b;font-weight:900}

  /* callout / placeholder */
  .callout{background:linear-gradient(180deg,#fff9e8,#fff2cf);border:2px dashed var(--bg-bot);
    border-radius:14px;padding:14px 16px;color:#8a5a00;font-weight:600}
  .soon{display:inline-block;background:var(--cyan);color:#083b47;font-weight:800;font-size:12px;
    text-transform:uppercase;letter-spacing:.5px;border-radius:999px;padding:3px 10px;margin-left:8px}
  .tip{background:var(--soft);border-left:4px solid var(--cyan);border-radius:0 12px 12px 0;
    padding:11px 14px;margin:10px 0 0;font-size:14px}
  .tip b{color:var(--indigo)}

  /* transport steps */
  .tline{display:grid;gap:10px;margin-top:6px}
  .tstep{display:flex;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
  .tstep .badge{flex:0 0 auto;background:var(--cyan);color:#083b47;font-weight:800;border-radius:10px;
    padding:6px 10px;font-size:13px;height:fit-content;text-transform:uppercase;letter-spacing:.5px}

  /* contact */
  .links{display:grid;gap:10px;margin-top:6px}
  .linkbtn{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--soft);
    border-radius:14px;padding:13px 15px;color:var(--ink);font-weight:700;transition:.15s}
  .linkbtn:hover{background:var(--indigo);color:#fff}
  .linkbtn:hover .lsub{color:#dcdcff}
  .linkbtn .lico{font-size:22px}
  .lsub{display:block;font-weight:600;color:var(--muted);font-size:13px}

  footer{text-align:center;color:var(--indigo);font-weight:700;padding:6px 16px 30px;position:relative;z-index:1}
  footer .heart{color:#d23b3b}
</style>
</head>

/* ---------- rendering ---------- */
let lang = localStorage.getItem("ya-lang");
if (!["en","tr"].includes(lang)){
  lang = (navigator.language||"").toLowerCase().startsWith("tr") ? "tr" : "en";
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o => esc(o[lang]);

function sectionShell(id, ico, title, inner, noteHtml){
  return `<section class="card" id="${id}">
    <div class="sec-head"><div class="sec-ico">${ico}</div><h2 class="sec-title">${title}</h2></div>
    ${inner}
    ${noteHtml||""}
  </section>`;
}

function renderFacts(d){
  const facts = d.items.map(i=>`<div class="fact"><div class="k">${L(i.k)}</div><div class="v">${L(i.v)}</div></div>`).join("");
  return sectionShell("facts", d.ico, L(d.title),
    `<div class="facts">${facts}</div>`,
    `<div class="tip">${L(d.note)}</div>`);
}

function renderPlaceholder(id, d){
  return sectionShell(id, d.ico, `${L(d.title)}<span class="soon">${L(UI.soon)}</span>`,
    `<div class="callout">${L(d.text)}</div>`);
}

function renderRules(d){
  const lis = d.list.map(r=>`<li><div><span class="rule-t">${L(r.t)}.</span> <span class="rule-d">${L(r.d)}</span></div></li>`).join("");
  return sectionShell("rules", d.ico, L(d.title),
    `<p class="intro">${L(d.intro)}</p><ol class="rules">${lis}</ol>`);
}

function renderPacking(d){
  const groups = d.groups.map((g,idx)=>{
    const items = g.items.map(i=>`<li>${L(i)}</li>`).join("");
    return `<details class="acc" ${idx===0?"open":""}>
      <summary>${L(g.name)} <span class="caret">▾</span></summary>
      <div class="body"><ul class="check">${items}</ul></div>
    </details>`;
  }).join("");
  return sectionShell("packing", d.ico, L(d.title),
    `<p class="intro">${L(d.intro)}</p>${groups}<div class="tip">${L(d.tip)}</div>`);
}

function renderDont(d){
  const items = d.items.map(i=>`<li>${L(i)}</li>`).join("");
  return sectionShell("dont", d.ico, L(d.title), `<ul class="no">${items}</ul>`);
}

function renderTransport(d){
  const steps = d.steps.map(s=>`<div class="tstep"><span class="badge">${L(s.b)}</span><div>${L(s.t)}</div></div>`).join("");
  return sectionShell("transport", d.ico, L(d.title),
    `<p class="intro">${L(d.intro)}</p><div class="tline">${steps}</div>`,
    `<div class="callout">${L(d.note)}</div>`);
}

function renderNotes(d){
  const items = d.items.map(i=>`<div class="tip"><b>${L(i.t)}</b><br>${L(i.d)}</div>`).join("");
  return sectionShell("notes", d.ico, L(d.title), items);
}

function renderContact(d){
  const links = d.links.map(l=>`<a class="linkbtn" href="${esc(l.href)}" target="_blank" rel="noopener">
      <span class="lico">${l.ico}</span><span>${L(l.t)}<span class="lsub">${L(l.s)}</span></span></a>`).join("");
  return sectionShell("contact", d.ico, L(d.title),
    `<div class="links">${links}</div>`,
    `<div class="tip">${L(d.note)}</div>`);
}

function render(){
  document.documentElement.lang = lang;
  // hero i18n bits
  const heroTxt = {
    tagline:{en:"Bound by Love",tr:"Sevgiyle Birleşen"},
    heroDates:{en:"18–20 September 2026",tr:"18–20 Eylül 2026"},
    heroLoc:{en:"Sapanca, Sakarya",tr:"Sapanca, Sakarya"},
    footer:{en:"Youth Alive 26 · See you at camp",tr:"Youth Alive 26 · Kampta görüşürüz"},
  };
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (heroTxt[k]) el.textContent = heroTxt[k][lang];
  });
  // toggle state
  document.getElementById("btn-en").setAttribute("aria-pressed", lang==="en");
  document.getElementById("btn-tr").setAttribute("aria-pressed", lang==="tr");

  // nav chips
  document.getElementById("chips").innerHTML = DATA.nav.map(n=>
    `<a class="chip" href="#${n.id}" data-target="${n.id}">${n.ico} ${n[lang]}</a>`).join("");

  // sections (order matches nav)
  document.getElementById("main").innerHTML =
    renderFacts(DATA.facts) +
    renderPlaceholder("schedule", DATA.schedule) +
    renderRules(DATA.rules) +
    renderPacking(DATA.packing) +
    renderDont(DATA.dont) +
    renderTransport(DATA.transport) +
    renderPlaceholder("music", DATA.music) +
    renderNotes(DATA.notes) +
    renderContact(DATA.contact);

  setupScrollSpy();
}

function setLang(l){
  lang = l;
  localStorage.setItem("ya-lang", l);
  render();
}

/* highlight active nav chip while scrolling */
let spyObserver;
function setupScrollSpy(){
  if (spyObserver) spyObserver.disconnect();
  const chips = [...document.querySelectorAll(".chip")];
  spyObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if (e.isIntersecting){
        chips.forEach(c=>c.classList.toggle("active", c.dataset.target===e.target.id));
      }
    });
  }, { rootMargin:"-45% 0px -50% 0px", threshold:0 });
  document.querySelectorAll("section.card").forEach(s=>spyObserver.observe(s));
}

render();

/* service worker for offline use */
if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
